<style>
  /* Layout: one full-bleed canvas, with thin DOM layers for HUD and job cards. */
  :root {
    --pine: #16302b; --moss: #3f6b3a; --sap: #f2b441; --heartwood: #e9c58f;
    --bark: #4a2f1f; --paper: #fff6e6; --danger: #d9482f;
    --display: "Lilita One", "Arial Black", system-ui, sans-serif;
    --body: "Nunito", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--pine); color: var(--paper); font-family: var(--body); }
  body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: absolute; inset: 0; pointer-events: none; padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
  #bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-family: var(--display); font-size: 18px; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
  #hint { margin-top: 10px; text-align: center; font-weight: 800; font-size: 16px; text-shadow: 0 2px 6px rgba(0,0,0,.6); min-height: 22px; }
  #tools { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; justify-content: center; gap: 10px; pointer-events: none; }
  .tool { pointer-events: auto; font: 400 16px var(--display); color: var(--paper); background: rgba(22,48,43,.82); border: 2px solid rgba(255,246,230,.3); border-radius: 14px; padding: 10px 16px; min-height: 48px; }
  .tool.on { background: var(--sap); color: var(--bark); border-color: var(--sap); }
  #card { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); background: rgba(10,24,21,.55); }
  #cardIn { width: 100%; max-width: 360px; max-height: 100%; overflow-y: auto; touch-action: pan-y; background: var(--paper); color: var(--bark); border-radius: 20px; padding: 22px; box-shadow: 0 14px 0 rgba(0,0,0,.25); }
  #cardIn h1 { font: 400 40px/1 var(--display); margin: 0 0 8px; color: var(--moss); text-wrap: balance; }
  #cardIn h2 { font: 400 26px/1.1 var(--display); margin: 0 0 8px; text-wrap: balance; }
  #cardIn p { margin: 0 0 12px; font-size: 16px; line-height: 1.4; }
  .stars { font-size: 34px; color: var(--sap); letter-spacing: 4px; margin-bottom: 8px; }
  .btn { display: block; width: 100%; font: 400 20px var(--display); color: var(--paper); background: var(--moss); border: 0; border-radius: 14px; padding: 14px; min-height: 52px; margin-top: 8px; }
  .btn.alt { background: transparent; color: var(--bark); box-shadow: inset 0 0 0 2px var(--bark); }
  .btn:focus-visible, .tool:focus-visible, .job:focus-visible { outline: 3px solid var(--sap); outline-offset: 2px; }
  #jobs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  .job { font: 400 20px var(--display); min-height: 56px; border: 0; border-radius: 12px; background: var(--moss); color: var(--paper); padding: 4px; }
  .job small { display: block; font: 800 11px var(--body); color: var(--sap); }
  .job:disabled { background: #d9cdb8; color: #9a8c76; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" hidden>
  <div id="bar"><span id="jobName"></span><span id="cash"></span></div>
  <div id="hint"></div>
</div>
<div id="tools" hidden></div>
<div id="card"><div id="cardIn"></div></div>
<noscript><p>Timber Job needs JavaScript to run.</p></noscript>
<script src="game.js"></script>
</body>
</html>
